name: build
on:
  push:
  pull_request:
jobs:
  compile:
    # GitHub-hosted runners have no GPU: this job proves that the code compiles for Ampere (sm_86)
    # and Blackwell / DGX Spark (sm_121), that the CPU benchmark is correct (self-test) and that the analysis script
    # works on the reference result files.
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.0.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v7
      - name: build
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y -qq make python3 libopenblas-dev
          make GIT_COMMIT=${GITHUB_SHA::12} ARCH="-gencode arch=compute_86,code=sm_86 -gencode arch=compute_121,code=sm_121"
          make cpu GIT_COMMIT=${GITHUB_SHA::12} CPU_ARCH=-march=x86-64-v2
      - name: binary starts
        run: ./trianglebench --help | head -3
      - name: CPU benchmark self-test and short run (runs without GPU)
        run: |
          ./trianglebench-cpu --selftest
          ./trianglebench-cpu --n 1024 --repeats 2 --seconds 0.5 --warmup 0.5 --label ci --out /tmp/ci_cpu
          python3 analysis/summarize.py /tmp/ci_cpu.json
      - name: analysis script
        run: python3 analysis/summarize.py results/*.json --csv /tmp/all.csv

  peak:
    # Builds the peak-throughput tools in peak/ (cuBLASLt, cuSPARSELt, CUDA Tile) for sm_86 and sm_121; no GPU needed.
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.4.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v7
      - name: build peak tools
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y -qq make python3 libcusparselt0-dev-cuda-13
          make -C peak ARCH="-gencode arch=compute_86,code=sm_86 -gencode arch=compute_121,code=sm_121"
          python3 -m py_compile peak/cutlasspeak.py peak/gb10run.py peak/benchrun.py

  jupyter:
    # Builds the JupyterLab image and executes the analysis notebook on the reference data (no GPU needed).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build --target jupyter --build-arg GIT_COMMIT=${GITHUB_SHA::12} -t trianglebench:jupyter .
      - name: execute notebook
        run: |
          mkdir -m 777 work
          docker run --rm -v "$PWD/work:/work" trianglebench:jupyter sh -c \
            "cp /opt/trianglebench/notebooks/*.ipynb . && jupyter nbconvert --to html --execute trianglebench-analysis.ipynb --output-dir export"
          ls work/export
          test -s work/export/trianglebench-analysis.html
          test -s work/export/tests_between_systems.csv
      - name: README figures render from the raw data
        run: |
          mkdir -m 777 -p docs/figures
          docker run --rm -v "$PWD:/r" -w /r --entrypoint python3 trianglebench:jupyter analysis/make_figures.py
          test $(ls docs/figures/*.png | wc -l) -eq 7
